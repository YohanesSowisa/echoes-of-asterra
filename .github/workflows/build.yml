name: Build Standalone Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            artifact_name: EchoesOfAsterra-windows.exe
            build_cmd: pyinstaller --name EchoesOfAsterra --onefile --windowed --add-data "assets;assets" main.py
            output_binary: dist/EchoesOfAsterra.exe
          - os: macos-latest
            artifact_name: EchoesOfAsterra-macos
            build_cmd: pyinstaller --name EchoesOfAsterra --onefile --add-data "assets:assets" main.py
            output_binary: dist/EchoesOfAsterra
          - os: ubuntu-latest
            artifact_name: EchoesOfAsterra-linux
            build_cmd: pyinstaller --name EchoesOfAsterra --onefile --add-data "assets:assets" main.py
            output_binary: dist/EchoesOfAsterra

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Test Suite
        run: |
          python -m unittest discover -s tests

      - name: Build Standalone Executable
        run: |
          ${{ matrix.build_cmd }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_binary }}
